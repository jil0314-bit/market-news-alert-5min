# GitHub Actions 전용 설정. 비밀 토큰은 이 파일에 쓰지 말고 GitHub Secrets에 넣습니다.
telegram:
  enabled: true
  bot_token: ""
  chat_id: ""
  disable_web_page_preview: true

runtime:
  timezone: "Asia/Seoul"
  mode_name: "글로벌 시장영향 1시간 속보"
  sqlite_path: "data/seen_news.sqlite3"
  log_path: "logs/market_news_alert.log"
  max_items_per_message: 8   # 중복을 실제로 걷어내므로 건수를 늘려도 도배되지 않는다
  max_items_per_topic: 2     # 한 주제(섹터·신호)가 메시지를 독차지하지 않게 제한
  max_items_per_source: 2    # 한 피드가 메시지를 독차지하지 않게 제한
  max_news_age_minutes: 120  # 1시간 주기 실행이라 앞뒤로 여유를 둔다
  request_timeout_sec: 15
  user_agent: "Mozilla/5.0 MarketNewsAlertBot/2.0 (+personal market monitoring)"

# 번역 설정: 영문 기사를 한국어로 번역하고 요약합니다
translation:
  enabled: true
  target_language: "ko"
  summary_max_chars: 600     # 세 줄 요약 기준. 너무 길면 오히려 읽기 나쁘다
  open_translated_page: true # 한글 웹번역 링크 제공

polling:
  market_open: "08:30"
  market_close: "15:45"
  market_interval_sec: 60
  normal_interval_sec: 300
  weekend_interval_sec: 900

filters:
  min_score_to_send: 8
  urgent_score: 22
  require_relevance_signal: true

  # ---- 근접중복 제거 ----
  # 아래 값들은 '주체(첫 단어)가 같고 숫자가 충돌하지 않는' 기사끼리만 적용된다.
  # 그 관문을 이미 통과했기 때문에 유사도 기준 자체는 낮게 잡아도 안전하다.
  # 중복이 여전히 보이면 0.30까지 낮추고, 다른 뉴스가 묶이면 0.45까지 올린다.
  duplicate_title_similarity: 0.34
  duplicate_containment_ratio: 0.75  # 짧은 속보가 긴 제목에 포함되는 경우 판정
  duplicate_window_hours: 48         # 과거 몇 시간치 발송분과 비교할지
  duplicate_retention_days: 30       # 발송기록 보관 기간
  duplicate_min_shared_words: 5      # 표현이 달라도 핵심 단어 N개가 겹치면 같은 사건

# 매체/공식기관 이름이 source에 들어가면 소폭 가산
