name: 미국장 브리핑 공개 데이터 수집

on:
  schedule:
    # Mon-Fri 21:20 UTC = Tue-Sat 06:20 KST, before the existing Claude 06:45 run.
    - cron: '20 21 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - collect_us_brief_data.py
      - .github/workflows/us-brief-data.yml

permissions:
  contents: write

concurrency:
  group: us-brief-data
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install existing collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect public data only (no Telegram secrets or sending)
        run: python collect_us_brief_data.py "$RUNNER_TEMP/us-brief/latest.json"
      - name: Publish data to dedicated branch (leave main and news state unchanged)
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin briefing-data > /dev/null; then
            git fetch origin briefing-data
            git checkout --detach FETCH_HEAD
          else
            git checkout -b briefing-data
          fi
          cp "$RUNNER_TEMP/us-brief/latest.json" latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: publish public US briefing inputs [skip ci]'
          git push origin HEAD:refs/heads/briefing-data
